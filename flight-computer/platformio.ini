; ============================================================================
;  PSI AVIONICS 2026 — Portenta H7 듀얼코어 로켓 에비오닉스
;
;   M7 = 비행제어 전부 (센서 / UKF Kalman / Decision / 낙하산 서보)  src/m7/main_m7.cpp
;   M4 = SD카드 100Hz 전체 로깅 + XBEE 다운샘플 텔레메트리          src/m4/main_m4.cpp
;
;  [빌드]   pio run
;  [업로드] ★반드시 M4 먼저 -> M7 (M7의 RPC.begin()이 M4를 부팅)
;           절차는 README.md 참고.
; ============================================================================

[env:portenta_h7_m7]
platform = ststm32@19.5.0
platform_packages = platformio/framework-arduino-mbed@4.5.0
board = portenta_h7_m7
framework = arduino
build_unflags = -Os                     ; 프레임워크 기본 -Os 제거
build_flags = -std=gnu++17 -O2          ; 속도 우선(100Hz UKF)
monitor_speed = 115200
build_src_filter = -<*> +<m7/>          ; M7 제어 펌웨어

[env:portenta_h7_m4]
platform = ststm32@19.5.0
platform_packages = platformio/framework-arduino-mbed@4.5.0
board = portenta_h7_m4
framework = arduino
build_unflags = -Os
build_flags = -std=gnu++17 -O2
build_src_filter = -<*> +<m4/>          ; M4 텔레메트리+SD 펌웨어
